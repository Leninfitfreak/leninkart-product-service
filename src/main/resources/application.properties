spring.datasource.url=jdbc:postgresql://postgres:5432/${DB_NAME:ecom}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.jpa.hibernate.ddl-auto=update
server.port=8081
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
app.jwt.secret=${APP_JWT_SECRET:dev-secret-change-me}
app.jwt.issuer=${APP_JWT_ISSUER:leninkart}
app.jwt.ttl-seconds=${APP_JWT_TTL_SECONDS:86400}
app.auth.users=${APP_AUTH_USERS:leninkart:leninkart123:USER}
