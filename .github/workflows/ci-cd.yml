name: Product-Service CI + Latest Tag Publish

on:
  push:
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: product-service-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: product-service
  CONTROL_REPO: deployment-poc
  CONTROL_BRANCH: main
  TAG_METADATA_FILE: config/latest_tags.yaml
  SECRET_CONTROL_PAT: INFRA_PAT

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.export.outputs.image_tag }}
      image_full: ${{ steps.export.outputs.image_full }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify OpenTelemetry Java agent in build context
        run: |
          test -f otel/opentelemetry-javaagent.jar
          ls -lh otel/opentelemetry-javaagent.jar

      - name: Build Docker Image
        run: |
          TAG="${{ github.run_id }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE_NAME }}:${TAG}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t "$IMAGE" .

      - name: Push Docker Image
        run: docker push "$IMAGE"

      - name: Export Image Output
        id: export
        run: |
          echo "image_tag=${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo "image_full=$IMAGE" >> $GITHUB_OUTPUT

  publish_latest_tag_metadata:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Select deployment environment
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [[ "$BRANCH" == "main" ]]; then
            echo "DEPLOY_ENV=prod" >> "$GITHUB_ENV"
          elif [[ "$BRANCH" == "staging" ]]; then
            echo "DEPLOY_ENV=staging" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_ENV=dev" >> "$GITHUB_ENV"
          fi

      - name: Checkout deployment-poc metadata repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.CONTROL_REPO }}
          token: ${{ secrets[env.SECRET_CONTROL_PAT] }}
          ref: ${{ env.CONTROL_BRANCH }}
          path: control-plane

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Publish latest tag metadata
        run: |
          cd control-plane
          mkdir -p "$(dirname "$TAG_METADATA_FILE")"
          if [[ ! -f "$TAG_METADATA_FILE" ]]; then
            printf 'services: {}\n' > "$TAG_METADATA_FILE"
          fi
          export SERVICE_KEY="${{ env.SERVICE_NAME }}"
          export IMAGE_REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE_NAME }}"
          export IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          export UPDATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          export SOURCE_REPO="${GITHUB_REPOSITORY}"
          export SOURCE_BRANCH="${GITHUB_REF_NAME}"
          export DEPLOY_ENV
          yq -i '
            .services[strenv(SERVICE_KEY)][strenv(DEPLOY_ENV)].latest = strenv(IMAGE_TAG) |
            .services[strenv(SERVICE_KEY)][strenv(DEPLOY_ENV)].image = strenv(IMAGE_REPO) |
            .services[strenv(SERVICE_KEY)][strenv(DEPLOY_ENV)].updated_at = strenv(UPDATED_AT) |
            .services[strenv(SERVICE_KEY)][strenv(DEPLOY_ENV)].source_repo = strenv(SOURCE_REPO) |
            .services[strenv(SERVICE_KEY)][strenv(DEPLOY_ENV)].source_branch = strenv(SOURCE_BRANCH)
          ' "$TAG_METADATA_FILE"
          cat "$TAG_METADATA_FILE"

      - name: Commit & push metadata update
        run: |
          cd control-plane
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$TAG_METADATA_FILE"
          if git diff --cached --quiet; then
            echo "No metadata changes to publish."
            exit 0
          fi
          git commit -m "ci(tags): publish product-service ${DEPLOY_ENV} latest ${IMAGE_TAG}"
          PUSH_OK=false
          for i in 1 2 3; do
            if git pull --rebase origin "$CONTROL_BRANCH" && git push origin "$CONTROL_BRANCH"; then
              PUSH_OK=true
              break
            fi
            echo "Push retry $i failed, retrying..."
            sleep 2
          done
          if [[ "$PUSH_OK" != "true" ]]; then
            echo "Failed to publish latest tag metadata to ${CONTROL_REPO}/${CONTROL_BRANCH} after 3 attempts." >&2
            exit 1
          fi
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
